name: Refresh Medium articles

on:
  schedule:
    - cron: "17 3,15 * * *"   # twice a day, 08:47 and 20:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_medium.py
      - name: Commit snapshot if it changed
        run: |
          [ -f assets/medium.json ] || { echo "No snapshot yet (feed unreachable)"; exit 0; }
          git add assets/medium.json
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Medium articles snapshot"
          git push
