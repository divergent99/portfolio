name: Refresh Medium articles

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 08:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_medium.py
      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet --exit-code -- assets/medium.json 2>/dev/null && git ls-files --error-unmatch assets/medium.json >/dev/null 2>&1; then
            echo "Nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/medium.json
          git commit -m "Refresh Medium articles snapshot"
          git push
